name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only the deploy job adds `id-token: write`, to sign in to Pulumi Cloud through OIDC.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The same command runs locally before a push, so the two can't drift apart.
      - run: bun run ci

  # Deployment values live in Pulumi ESC (ADR 0005); `bun run wizard` sets up the secrets and
  # DEPLOY_ENABLED flag this job reads; until then (and on forks) it is skipped. Identifiers are
  # secrets so GitHub masks even the step headers, before any script can run. Pulumi Cloud trusts
  # only this job on a push to master (README → CI's sign-in to Pulumi Cloud), so a run started
  # by hand only tests.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-26.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @mise/web build
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.270.0

      # Validate without printing values. No fallback to the old plain variables: a step's env
      # header prints before its script, too early for ::add-mask:: to hide those values.
      - name: Check deployment configuration
        env:
          PULUMI_ORG: ${{ secrets.PULUMI_ORG }}
          PULUMI_STACK: ${{ secrets.PULUMI_STACK }}
          PULUMI_ESC_ENVIRONMENT: ${{ secrets.PULUMI_ESC_ENVIRONMENT }}
          PULUMI_CI_USER: ${{ secrets.PULUMI_CI_USER }}
        run: |
          for name in PULUMI_ORG PULUMI_STACK PULUMI_ESC_ENVIRONMENT PULUMI_CI_USER CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set (README → Private deployment identifiers)"
              exit 1
            fi
          done
          if [[ ! "$PULUMI_STACK" =~ ^[^/]+/[^/]+/[^/]+$ || "${PULUMI_STACK%%/*}" != "$PULUMI_ORG" ]]; then
            echo "::error::PULUMI_STACK must be an organization/project/stack in PULUMI_ORG"
            exit 1
          fi

      # Exchanges this job's GitHub ID token for a personal token of PULUMI_CI_USER, exported as
      # PULUMI_ACCESS_TOKEN; the action masks both. Pulumi Cloud grants it only to this job on a
      # push to master (scripts/trust-pulumi-ci.ts). A deploy takes about a minute and a first one
      # runs `pulumi up` twice: half an hour leaves room, as a token that expires mid-`pulumi up`
      # leaves the stack locked. Pinned to the commit of v2.1.1.
      - name: Sign in to Pulumi Cloud through OIDC
        uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622
        with:
          organization: ${{ secrets.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ secrets.PULUMI_CI_USER }}
          token-expiration: 1800

      - name: Select the stack and its ESC environment
        working-directory: infra
        env:
          PULUMI_STACK: ${{ secrets.PULUMI_STACK }}
          PULUMI_ESC_ENVIRONMENT: ${{ secrets.PULUMI_ESC_ENVIRONMENT }}
          PULUMI_CI_USER: ${{ secrets.PULUMI_CI_USER }}
        run: |
          if [ "$(pulumi whoami)" != "$PULUMI_CI_USER" ]; then
            echo "::error::Signed in to Pulumi Cloud as someone other than PULUMI_CI_USER"
            exit 1
          fi
          pulumi stack select "$PULUMI_STACK"
          pulumi config env add "$PULUMI_ESC_ENVIRONMENT" --yes > /dev/null
          pulumi config --show-secrets --json | jq -r '.. | strings | select(length >= 4)' |
            while IFS= read -r value; do echo "::add-mask::$value"; done

      - name: Check no private values are committed
        run: pulumi config --cwd infra --show-secrets --json | bun run check:private -

      # Replays the latest nightly export through this code's migrations and parsers, so a change
      # that cannot read the stored Household stops here instead of breaking it (CODING_STANDARDS.md).
      - name: Check this code reads the stored Household
        run: |
          account="$(pulumi stack output --cwd infra cloudflareAccountId --show-secrets)"
          echo "::add-mask::$account"
          CLOUDFLARE_ACCOUNT_ID="$account" bun run check:export

      - name: pulumi up
        run: pulumi up --cwd infra --yes --skip-preview

      - name: wrangler deploy
        working-directory: apps/worker
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          pulumi stack output --cwd ../../infra workerSecrets --show-secrets --json > "$secrets"
          CLOUDFLARE_ACCOUNT_ID="$(pulumi stack output --cwd ../../infra cloudflareAccountId --show-secrets)" \
            bunx wrangler deploy --secrets-file "$secrets"

      # The custom domain needs the Worker, so a brand-new deployment binds it after the first deploy.
      - name: Bind the hostname on a first deploy
        run: |
          if [ "$(pulumi stack output --cwd infra hostnameBound)" != "true" ]; then
            pulumi up --cwd infra --yes --skip-preview
          fi
