name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:private
      - run: bun test packages
      - run: bun run --filter @mise/web build
      - run: bun run test:worker
      - run: bun run test:web

  # Deployment values live in Pulumi ESC (ADR 0005); `bun run wizard` sets up the secrets and
  # variables this job reads; until then (and on forks) it is skipped. Logs are public, so every
  # config value is masked before anything runs.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.PULUMI_STACK != ''
    needs: test
    runs-on: ubuntu-26.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @mise/web build
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.270.0

      - name: Select the stack and its ESC environment
        working-directory: infra
        env:
          PULUMI_STACK: ${{ vars.PULUMI_STACK }}
          PULUMI_ESC_ENVIRONMENT: ${{ vars.PULUMI_ESC_ENVIRONMENT }}
        run: |
          # Pulumi prints update URLs naming the organization.
          echo "::add-mask::$PULUMI_STACK"
          echo "::add-mask::${PULUMI_STACK%%/*}"
          pulumi stack select "$PULUMI_STACK"
          pulumi config env add "$PULUMI_ESC_ENVIRONMENT" --yes > /dev/null
          pulumi config --show-secrets --json | jq -r '.. | strings | select(length >= 4)' |
            while IFS= read -r value; do echo "::add-mask::$value"; done

      - name: Check no private values are committed
        run: pulumi config --cwd infra --show-secrets --json | bun run check:private -

      - name: pulumi up
        run: pulumi up --cwd infra --yes --skip-preview

      - name: wrangler deploy
        working-directory: apps/worker
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          pulumi stack output --cwd ../../infra workerSecrets --show-secrets --json > "$secrets"
          CLOUDFLARE_ACCOUNT_ID="$(pulumi stack output --cwd ../../infra cloudflareAccountId --show-secrets)" \
            bunx wrangler deploy --secrets-file "$secrets"

      # The custom domain needs the Worker, so a brand-new deployment binds it after the first deploy.
      - name: Bind the hostname on a first deploy
        run: |
          if [ "$(pulumi stack output --cwd infra hostnameBound)" != "true" ]; then
            pulumi up --cwd infra --yes --skip-preview
          fi
