# The settings a Mise deployment needs. Real values never go in this repo (ADR 0005): keep them in a
# Pulumi ESC environment and point your stack at it. `bun run wizard` walks you through it.
#
# 1. Create the ESC environment (e.g. `<your-org>/mise/production`) with this definition:
#
#    values:
#      pulumiConfig:
#        # Your Cloudflare account ID, and the zone and hostname Mise is served at.
#        mise:accountId: 0123456789abcdef0123456789abcdef
#        mise:zone: example.com
#        mise:hostname: mise.example.com
#        # Your Zero Trust team domain (Zero Trust → Settings → Custom pages).
#        mise:accessTeamDomain: example.cloudflareaccess.com
#        # Who may sign in: a list of Google accounts, a Google Workspace domain, or both.
#        mise:allowedEmails:
#          - cook@example.com
#          - sous-chef@example.com
#        # mise:allowedEmailDomain: example.com
#        # A Google OAuth client for Access's Google login.
#        mise:googleClientId: 000000000000-example.apps.googleusercontent.com
#        mise:googleClientSecret:
#          fn::secret: GOCSPX-example
#        # The Anthropic API key the chat's agent runs on (console.anthropic.com → API keys). Set a
#        # monthly spend limit in the Anthropic console (Settings → Limits): Mise has no cap of its own.
#        # Without a key the chat answers nothing.
#        mise:anthropicApiKey:
#          fn::secret: sk-ant-api03-example
#        # Optional: a Google Drive folder whose Docs become Drafts every night (README → Google Drive
#        # folder). The id is the end of the folder's URL; the key is the service account's JSON key,
#        # on one line, and the folder must be shared with the service account's email.
#        # mise:driveFolderId: 0BxExampleFolderId
#        # mise:googleServiceAccountKey:
#        #   fn::secret: '{"type":"service_account","client_email":"mise-drive@example.com","private_key":"-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"}'
#        # Notifications (README → Notifications): a P-256 private key, PKCS#8, base64 on one line. Make
#        # it once and keep it: a new key turns notifications off on every device. Without it, none.
#        #   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 | tr -d '\n'
#        mise:vapidPrivateKey:
#          fn::secret: MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgExample
#        # Optional: report errors and traces to Sentry.
#        # mise:sentryDsn:
#        #   fn::secret: https://<public-key>@<org>.ingest.sentry.io/<project>
#
# 2. The stack file then only imports it. CI writes this file on every run from the
#    PULUMI_ESC_ENVIRONMENT repository variable; locally, `pulumi config env add` writes it.
environment:
  - mise/production
